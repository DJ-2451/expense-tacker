<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Expense Tracker</h1>
    <div class="container">
      <div class="balance">
      <h4>Balance</h4>
       <h2 id="balance">0000</h2></div>
      <div class="in-ex">
        <div>
          <p>Income</p>
          <p id="income">0000</p>
        </div>
        <div>
          <p>Expense</p>
          <p id="expense">0000</p>
        </div>
      </div>
      <div id="history" class="history-clear">
        <h3>History</h3>
        <!-- <ul class="list" id="list">
          <li class="minus">
            Cash <span>-₹400</span> -->
            <!-- <button class="del-btn">x</button> -->
          </li>
        </ul>
      </div>
      <div class="add-trans">
        <h3>Add Transactions</h3>
        <h4>Text</h4>
        <input type="text" placeholder="Enter Text..." id="text" />
        <h4>Amount</h4>
        <small>(negative-expense,positive+income)</small>
        <input type="number" placeholder="Enter amount..." id="amount" />
        <button class="btn" id="submit">Add Transactions</button>
        <button class="btn" id="clear">Clear All</button>
      </div>

    </div>

    <script src="index.js"></script>
  </body>
</html>
